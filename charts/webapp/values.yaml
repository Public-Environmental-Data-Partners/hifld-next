replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

# Server-only Portolan catalog settings. DATASET_API_URL remains available
# during the bounded dual-read/rollback window.
catalog:
  sqliteUrl: ""
  storageLocationsJson: ""
  cacheDirectory: /var/lib/hifld/catalog
  cacheSizeLimit: 1Gi
  tmpDirectory: /var/lib/hifld/catalog-tmp
  tmpSizeLimit: 256Mi

serviceAccount:
  create: false
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

containerPort: 8080

# Canonical browser origin used to validate Origin on the same-origin MCP proxy.
# Production deployments should set an absolute HTTPS origin.
publicOrigin: ""

# WebMCP registration is enabled for native scanner acceptance. Unsupported
# browsers still no-op. DATASET_MCP_QUERY_API_URL is read only by the server;
# it is never copied into runtime client configuration. Supply an origin-trial
# token through secretEnv, never through a browser-exposed value.
env:
  - name: WEBMCP_ENABLED
    value: "true"
  # Optional server-only public endpoint advertised by the MCP Server Card.
  # Empty means the same-origin /mcp proxy.
  - name: DATASET_MCP_PUBLIC_ENDPOINT
    value: ""
# Add DATASET_MCP_QUERY_API_URL in environment-specific values when the
# dataset-mcp service is deployed. Omitting it keeps the optional URL valid and
# makes query/MCP proxy requests fail closed with a sanitized 503.
# Example server-only token wiring (keep the token in a Secret):
# secretEnv:
#   - name: WEBMCP_ORIGIN_TRIAL_TOKEN
#     secretName: webapp-webmcp
#     key: origin-trial-token
secretEnv: []

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "1", memory: 1Gi}

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
podSecurityContext: {seccompProfile: {type: RuntimeDefault}}

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
