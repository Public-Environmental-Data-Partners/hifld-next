replicaCount: 1

image:
  repository: ghcr.io/public-environmental-data-partners/hifld-next/feature-server
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

containerPort: 8000

# The direct URL is a compatibility fallback. Prefer pointerUrl after publishing
# an immutable release bundle; readers verify the pointer-selected SQLite before
# atomically swapping their disposable local snapshot.
catalog:
  url: ""
  pointerUrl: ""
  pollSeconds: 30

storage:
  locationsJson: "{}"
  allowedCidrs: []
  allowedPorts: [443, 8333]

env: []
secretEnv: []

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "1", memory: 1Gi}

tmp:
  directory: /var/lib/feature-server/spill
  sizeLimit: 1Gi
cache:
  directory: /var/lib/feature-server/cache
  sizeLimit: 2Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
podSecurityContext:
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

livenessProbe: {path: /healthz, initialDelaySeconds: 15, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
readinessProbe: {path: /readyz, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}

networkPolicy:
  enabled: true
  dnsCidrs: [169.254.20.10/32]
  extraEgress: []
nodeSelector: {}
tolerations: []
affinity: {}
