apiVersion: v1
kind: Service
metadata:
  name: {{ include "feature-server.fullname" . }}
  labels: {{- include "feature-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}]
  selector: {app.kubernetes.io/name: {{ include "feature-server.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
