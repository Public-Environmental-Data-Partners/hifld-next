{{- if .Values.clickhouse.enabled }}
{{- if lt (int .Values.clickhouse.maxConcurrentQueries) 1 }}
{{- fail "clickhouse.maxConcurrentQueries must be positive (zero disables the safety limit)" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataset-mcp.fullname" . }}-clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}-clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: 8123, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataset-mcp.fullname" . }}-clickhouse-replicas
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}-clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: 8123, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataset-mcp.fullname" . }}-clickhouse
spec:
  {{- if not .Values.clickhouse.autoscaling.enabled }}
  replicas: {{ .Values.clickhouse.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}-clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}-clickhouse
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ default .Values.image.tag .Values.clickhouse.image.tag }}"
          ports: [{name: http, containerPort: 8123}]
          env:
            - name: CLICKHOUSE_MAX_CONCURRENT_QUERIES
              value: {{ .Values.clickhouse.maxConcurrentQueries | quote }}
            - name: CLICKHOUSE_QUERY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.secretName }}, key: {{ .Values.clickhouse.queryPasswordKey }}}}
            - name: CLICKHOUSE_CONTROL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.clickhouse.secretName }}, key: {{ .Values.clickhouse.controlPasswordKey }}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: cache, mountPath: /var/lib/clickhouse}
            - {name: logs, mountPath: /var/log/clickhouse-server}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: {{ .Values.clickhouse.cacheSizeLimit }}}
        - name: logs
          emptyDir: {sizeLimit: 512Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
{{- if .Values.clickhouse.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dataset-mcp.fullname" . }}-clickhouse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dataset-mcp.fullname" . }}-clickhouse
  minReplicas: {{ .Values.clickhouse.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.clickhouse.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.clickhouse.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataset-mcp.fullname" . }}-clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}-clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dataset-mcp.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 8123}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.networkPolicy.dnsCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- end }}
    {{- range .Values.storage.allowedCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $.Values.storage.allowedPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
