image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ""

database:
  existingSecret: ""
  urlKey: DATABASE_URL

defaults:
  command: ["uv", "run", "--no-sync", "python", "-m", "jobs.discover"]
  concurrencyPolicy: Forbid
  restartPolicy: Never
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources: {}
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  podSecurityContext: {}

jobs: {}
# Example:
# jobs:
#   hifld-prod:
#     enabled: true
#     schedule: "0 * * * *"
#     storageLocationSlug: gcs-hifld-next-datasets-prod
#     collectionSlug: hifld
#     dryRun: false
#     pruneStale: false
#     prefix: ""
#     limit: null

configSyncJobs: {}
# Example:
# configSyncJobs:
#   prod:
#     enabled: true
#     schedule: "15 * * * *"
#     formatConfigUri: gs://hifld-next-config-prod/catalog/formats.json
#     storageConfigUri: gs://hifld-next-config-prod/catalog/storage-locations.json
#     dryRun: false
