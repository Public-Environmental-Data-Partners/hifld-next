name: Publish app images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - "dataset-api/**"
      - "webapp/**"

permissions:
  contents: read
  packages: write

env:
  DATASET_API_IMAGE: ghcr.io/public-environmental-data-partners/hifld-next/dataset-api
  WEBAPP_IMAGE: ghcr.io/public-environmental-data-partners/hifld-next/webapp
  DEFAULT_LB_DOMAIN: hifld.publicenvirodata.org

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags and build args
        id: meta
        env:
          LB_DOMAIN: ${{ vars.LB_DOMAIN || vars.TF_VAR_LB_DOMAIN }}
          VITE_PUBLIC_DATASET_API_URL: ${{ vars.VITE_PUBLIC_DATASET_API_URL }}
        run: |
          set -euo pipefail

          dataset_tags="${DATASET_API_IMAGE}:${GITHUB_SHA}"
          webapp_tags="${WEBAPP_IMAGE}:${GITHUB_SHA}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            dataset_tags="${dataset_tags}"$'\n'"${DATASET_API_IMAGE}:latest"
            webapp_tags="${webapp_tags}"$'\n'"${WEBAPP_IMAGE}:latest"
          fi

          public_api_url="$VITE_PUBLIC_DATASET_API_URL"
          if [ -z "$public_api_url" ]; then
            lb_domain="$LB_DOMAIN"
            if [ -z "$lb_domain" ]; then
              lb_domain="$DEFAULT_LB_DOMAIN"
            fi
            public_api_url="https://${lb_domain}"
          fi

          {
            echo "dataset_tags<<EOF"
            echo "$dataset_tags"
            echo "EOF"
            echo "webapp_tags<<EOF"
            echo "$webapp_tags"
            echo "EOF"
            echo "public_api_url=$public_api_url"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push dataset-api
        uses: docker/build-push-action@v6
        with:
          context: dataset-api
          file: dataset-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.dataset_tags }}

      - name: Build and push webapp
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.webapp_tags }}
          build-args: |
            NODE_ENV=production
            VITE_PUBLIC_DATASET_API_URL=${{ steps.meta.outputs.public_api_url }}
