name: Publish app images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "dataset-api/**"
      - "dataset-mcp/**"
      - "charts/dataset-api/**"
      - "charts/dataset-discovery/**"
      - "charts/dataset-mcp/**"
      - "charts/webapp/**"
      - "packages/map-core/**"
      - "packages/map-ui/**"
      - "webapp/**"

permissions:
  contents: read
  packages: write

env:
  DATASET_API_IMAGE: ghcr.io/public-environmental-data-partners/hifld-next/dataset-api
  WEBAPP_IMAGE: ghcr.io/public-environmental-data-partners/hifld-next/webapp
  DATASET_MCP_IMAGE: ghcr.io/public-environmental-data-partners/hifld-next/dataset-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail

          dataset_tags="${DATASET_API_IMAGE}:${GITHUB_SHA}"
          webapp_tags="${WEBAPP_IMAGE}:${GITHUB_SHA}"
          mcp_tags="${DATASET_MCP_IMAGE}:${GITHUB_SHA}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            dataset_tags="${dataset_tags}"$'\n'"${DATASET_API_IMAGE}:latest"
            webapp_tags="${webapp_tags}"$'\n'"${WEBAPP_IMAGE}:latest"
            mcp_tags="${mcp_tags}"$'\n'"${DATASET_MCP_IMAGE}:latest"
          fi

          {
            echo "dataset_tags<<EOF"
            echo "$dataset_tags"
            echo "EOF"
            echo "webapp_tags<<EOF"
            echo "$webapp_tags"
            echo "EOF"
            echo "mcp_tags<<EOF"
            echo "$mcp_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push dataset-api
        uses: docker/build-push-action@v6
        with:
          context: dataset-api
          file: dataset-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.dataset_tags }}

      - name: Build and push webapp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.webapp_tags }}
          build-args: |
            NODE_ENV=production

      - name: Build and push dataset-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dataset-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.mcp_tags }}
