name: Security scans
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [dataset-mcp, feature-server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - name: Audit locked runtime requirements
        run: uvx pip-audit==2.10.1 --disable-pip --no-deps --requirement requirements-audit.txt

  feature-server-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: feature-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run basedpyright
      - name: Install DuckDB extensions for spatial regression tests
        run: uv run python -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL spatial; INSTALL httpfs'); c.close()"
      - run: uv run pytest

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webapp
            context: .
            file: webapp/Dockerfile
          - name: dataset-mcp
            context: .
            file: dataset-mcp/Dockerfile
          - name: feature-server
            context: .
            file: feature-server/Dockerfile
          - name: clickhouse
            context: ops/clickhouse
            file: ops/clickhouse/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build current image with refreshed base
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          load: true
          push: false
          tags: hifld-security:${{ matrix.name }}
      - name: Scan image packages
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: hifld-security:${{ matrix.name }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
      - name: Upload security findings
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container/${{ matrix.name }}
      - name: Preserve scan report
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.name }}
          path: ${{ steps.scan.outputs.sarif }}
      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: hifld-security:${{ matrix.name }}
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table
