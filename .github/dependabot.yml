version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directories:
      - /dataset-mcp
      - /feature-server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /ops/clickhouse
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /webapp
      - /dataset-mcp
      - /feature-server
      - /ops/clickhouse
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
