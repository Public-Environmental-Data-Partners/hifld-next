[project]
name = "dataset-mcp"
version = "0.1.0"
description = "Public MCP application server for HIFLD datasets"
requires-python = ">=3.12"
dependencies = ["fastmcp", "fastapi", "uvicorn[standard]", "httpx", "pydantic-settings", "duckdb", "sqlglot[rs]"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "pyright", "basedpyright"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "query_worker"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
