[project]
name = "dataset-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "google-cloud-storage>=2.19.0",
    "httpx>=0.27.2",
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "pyarrow>=16.1.0",
    "fiona>=1.9.6",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.1",
    "shapely>=2.0.4",
    "python-dotenv>=1.2.1",
    "openpyxl>=3.1.5",
    "sqlglot[rs]>=28.1.0",
    "duckdb>=1.4.2",
    "geopandas>=1.1.1",
    "aiobotocore>=3.0.0",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.31",
    "alembic>=1.17.2",
    "psycopg2-binary>=2.9.9",
    "psutil>=5.9.0",
    "fsspec>=2026.1.0",
    "gcsfs>=2026.1.0",
    "s3fs>=2026.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
]
storage = [
    "gcsfs>=2024.3.1",
    "s3fs>=2024.3.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.5",
    "globus-sdk>=4.3.1",
    "pydantic-ai>=1.38.0",
    "pyright>=1.1.409",
    "ruff>=0.9.0",
]

[tool.pyright]
include = [
    "api",
    "database",
    "jobs",
    "models",
    "processing",
    "schemas",
    "services",
    "storage",
    "utils",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "alembic",
    "scripts",
    "tests",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportAssignmentType = false
reportUnknownParameterType = "error"
reportMissingTypeArgument = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedBaseClass = "error"
