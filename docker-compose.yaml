# Environment variables are loaded from .env file automatically by docker-compose
# Copy .env.example to .env and configure your settings

services:
  # PostgreSQL database for dataset-api metadata
  # Stores collections, datasets, formats, and sources metadata
  dataset-api-postgres:
    image: postgres:17-alpine
    container_name: hifld-dataset-api-postgres
    environment:
      POSTGRES_DB: ${DATASET_API_POSTGRES_DB:-hifld_datasets}
      POSTGRES_USER: ${DATASET_API_POSTGRES_USER:-hifld}
      POSTGRES_PASSWORD: ${DATASET_API_POSTGRES_PASSWORD:-hifld_dev}
    volumes:
      - dataset_api_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATASET_API_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASET_API_POSTGRES_USER:-hifld}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hifld-network

  discover-job:
    build:
      context: ./dataset-api
    command: uv run python -m jobs.discover
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hifld:hifld_dev@dataset-api-postgres:5432/hifld_datasets}
      DISCOVER_STORAGE_LOCATION_SLUG: ${DISCOVER_STORAGE_LOCATION_SLUG:-seaweedfs-drp-hifld-copy-formatted}
      DISCOVER_COLLECTION_SLUG: ${DISCOVER_COLLECTION_SLUG:-hifld}
      DISCOVER_PREFIX: ${DISCOVER_PREFIX:-}
      DISCOVER_DRY_RUN: ${DISCOVER_DRY_RUN:-false}
      DISCOVER_PRUNE_STALE: ${DISCOVER_PRUNE_STALE:-false}
      DISCOVER_LIMIT: ${DISCOVER_LIMIT:-}
    depends_on:
      dataset-api-postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - hifld-network

  # SeaweedFS Master
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - hifld-network

  # SeaweedFS Volume Server
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8080
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      - seaweedfs-master
    networks:
      - hifld-network

  # SeaweedFS Filer (provides S3 API and file management)
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -s3
    ports:
      - "8888:8888" # Filer HTTP API
      - "8333:8333" # S3 API port
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    networks:
      - hifld-network

volumes:
  dataset_api_postgres_data:
    driver: local
  seaweedfs_master_data:
    driver: local
  seaweedfs_volume_data:
    driver: local
  seaweedfs_filer_data:
    driver: local

networks:
  hifld-network:
    driver: bridge
