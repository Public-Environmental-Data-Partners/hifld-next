# Environment variables are loaded from .env file automatically by docker-compose
# Copy .env.example to .env and configure your settings

services:
  clickhouse:
    build:
      context: ./ops/clickhouse
    image: hifld-clickhouse:local
    environment:
      CLICKHOUSE_QUERY_PASSWORD: ${CLICKHOUSE_QUERY_PASSWORD:-hifld_query_local_only}
      CLICKHOUSE_CONTROL_PASSWORD: ${CLICKHOUSE_CONTROL_PASSWORD:-hifld_control_local_only}
      CLICKHOUSE_MAX_CONCURRENT_QUERIES: ${CLICKHOUSE_MAX_CONCURRENT_QUERIES:-2}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_cache:/var/lib/clickhouse
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hifld-network

  # PostgreSQL database for dataset-api metadata
  # Stores collections, datasets, formats, and sources metadata
  dataset-api-postgres:
    image: postgres:17-alpine
    container_name: hifld-dataset-api-postgres
    environment:
      POSTGRES_DB: ${DATASET_API_POSTGRES_DB:-hifld_datasets}
      POSTGRES_USER: ${DATASET_API_POSTGRES_USER:-hifld}
      POSTGRES_PASSWORD: ${DATASET_API_POSTGRES_PASSWORD:-hifld_dev}
    volumes:
      - dataset_api_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATASET_API_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASET_API_POSTGRES_USER:-hifld}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hifld-network

  discover-job:
    build:
      context: ./dataset-api
    command: uv run python -m jobs.discover
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hifld:hifld_dev@dataset-api-postgres:5432/hifld_datasets}
      DISCOVER_STORAGE_LOCATION_SLUG: ${DISCOVER_STORAGE_LOCATION_SLUG:-seaweedfs-drp-hifld-copy-formatted}
      DISCOVER_COLLECTION_SLUG: ${DISCOVER_COLLECTION_SLUG:-hifld}
      DISCOVER_PREFIX: ${DISCOVER_PREFIX:-}
      DISCOVER_DRY_RUN: ${DISCOVER_DRY_RUN:-false}
      DISCOVER_PRUNE_STALE: ${DISCOVER_PRUNE_STALE:-false}
      DISCOVER_LIMIT: ${DISCOVER_LIMIT:-}
    depends_on:
      dataset-api-postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - hifld-network

  # OGC API - Features adapter over the shared Portolan SQLite catalog.
  # Opt in with: docker compose --profile feature-server up -d feature-server
  feature-server:
    build:
      context: .
      dockerfile: feature-server/Dockerfile
    image: ${FEATURE_SERVER_IMAGE:-hifld-feature-server:local}
    environment:
      FEATURE_SERVER_CATALOG_URL: ${FEATURE_SERVER_CATALOG_URL:-http://seaweedfs-filer:8333/hifld-local-published/_catalog/catalog.sqlite}
      FEATURE_SERVER_CATALOG_POLL_SECONDS: ${FEATURE_SERVER_CATALOG_POLL_SECONDS:-30}
      FEATURE_SERVER_STORAGE_LOCATIONS: ${FEATURE_SERVER_STORAGE_LOCATIONS:-{"seaweedfs-local-published":{"type":"seaweedfs","bucket":"hifld-local-published","prefix":"hifld","endpoint_url":"http://seaweedfs-filer:8333"}}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dummy}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dummy}
      FEATURE_SERVER_PUBLIC_URL: ${FEATURE_SERVER_PUBLIC_URL:-http://localhost:8002}
      FEATURE_SERVER_CATALOG_CACHE_DIRECTORY: /var/lib/feature-server/cache
      FEATURE_SERVER_TEMP_DIRECTORY: /var/lib/feature-server/spill
    ports:
      - "${FEATURE_SERVER_PORT:-8002}:8000"
    volumes:
      - feature_server_tmp:/var/lib/feature-server/spill
      - feature_server_cache:/var/lib/feature-server/cache
    depends_on:
      feature-server-volume-init:
        condition: service_completed_successfully
      seaweedfs-filer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    profiles:
      - feature-server
    networks:
      - hifld-network

  feature-server-volume-init:
    image: ${FEATURE_SERVER_IMAGE:-hifld-feature-server:local}
    user: "0:0"
    command: ["/bin/sh", "-c", "chown -R 65532:65532 /var/lib/feature-server"]
    volumes:
      - feature_server_tmp:/var/lib/feature-server/spill
      - feature_server_cache:/var/lib/feature-server/cache
    profiles:
      - feature-server

  # SeaweedFS Master
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - hifld-network

  # SeaweedFS Volume Server
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8080
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      - seaweedfs-master
    networks:
      - hifld-network

  # SeaweedFS Filer (provides S3 API and file management)
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: hifld-seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -s3
    ports:
      - "8888:8888" # Filer HTTP API
      - "8333:8333" # S3 API port
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    networks:
      - hifld-network

volumes:
  clickhouse_cache:
    driver: local
  dataset_api_postgres_data:
    driver: local
  seaweedfs_master_data:
    driver: local
  seaweedfs_volume_data:
    driver: local
  seaweedfs_filer_data:
    driver: local
  feature_server_tmp:
    driver: local
  feature_server_cache:
    driver: local

networks:
  hifld-network:
    driver: bridge
